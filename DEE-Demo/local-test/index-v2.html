<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeGraph UW</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://connect-cdn.atl-paas.net/all.js"></script>
  <script src="cytoscape.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>CodeGraph UW</h1>
      <p>GitHub Repository Knowledge Graph Analyzer</p>
    </div>

    <div class="controls">
      <div class="form-group">
        <label for="repoUrl">GitHub Repository URL</label>
        <input
          type="url"
          id="repoUrl"
          placeholder="https://github.com/user/repo"
          value="https://github.com/facebook/react"
        >
      </div>

      <div class="form-group">
        <label for="branch">Branch (default: main)</label>
        <input
          type="text"
          id="branch"
          placeholder="main"
          value="main"
        >
      </div>

      <button id="analyzeBtn">Analyze Repository</button>
      <button id="clearBtn">Clear Graph</button>
      <button id="loadBtn">Load Saved Graph</button>
    </div>

    <div id="messageArea"></div>

    <div class="stats">
      <div class="stat-item">
        <span>Files:</span>
        <span class="stat-value" id="fileCount">0</span>
      </div>
      <div class="stat-item">
        <span>Nodes:</span>
        <span class="stat-value" id="nodeCount">0</span>
      </div>
      <div class="stat-item">
        <span>Edges:</span>
        <span class="stat-value" id="edgeCount">0</span>
      </div>
    </div>

    <div class="graph-container">
      <div id="cy"></div>
      <div class="node-details" id="nodeDetails"></div>
    </div>

    <div class="file-list" id="fileList"></div>
  </div>

  <script src="app-v2.js"></script>
</body>
</html>
