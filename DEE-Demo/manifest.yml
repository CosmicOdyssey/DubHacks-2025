app:
  id: ari:cloud:ecosystem::app/75403e69-092d-4ed1-a68c-ea312f1601e4
  runtime:
    name: nodejs20.x

modules:
  function:
    - key: codegraph-demo-resolver
      handler: backend/resolvers.handler
  jira:projectPage:
    - key: codegraph-demo-project-page
      title: CodeGraph Demo (Dev)
      resource: ui
      resolver:
        function: codegraph-demo-resolver

resources:
  - key: ui
    path: static/ui

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - read:jira-user
  external:
    fetch:
      client:
        - 'api.github.com'
        - 'generativelanguage.googleapis.com'
