app:
  id: ari:cloud:ecosystem::app/75403e69-092d-4ed1-a68c-ea312f1601e4
  runtime:
    name: nodejs20.x

modules:
  function:
    - key: main-resolver
      handler: backend/resolvers.handler
  jira:projectPage:
    - key: dee-pm-dashboard
      title: DEE PM Dashboard
      resource: pm-ui
      resolver:
        function: main-resolver
  jira:issueContext:
    - key: dee-demo-issue-panel
      title: DEE Impact
      label: DEE Impact
      description: Compact per-issue DEE panel
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
      resource: ui
      resolver:
        function: main-resolver

resources:
  - key: ui
    path: static/ui
  - key: pm-ui
    path: static/ui

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - address: https://*.herokuapp.com
        - address: https://*.railway.app
        - address: https://*.vercel.app
        - address: https://*.ngrok.io
        - address: https://*.ngrok-free.app
