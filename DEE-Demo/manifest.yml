app:
  id: ari:cloud:ecosystem::app/75403e69-092d-4ed1-a68c-ea312f1601e4
  runtime:
    name: nodejs20.x

modules:
  function:
    - key: main-resolver
      handler: backend/resolvers.handler
  jira:projectPage:
    - key: dee-demo-hello-world-project-page
      title: CodeGraph UW
      resource: ui
      resolver:
        function: main-resolver

resources:
  - key: ui
    path: static/ui

permissions:
  scopes:
    - storage:app
  external:
    fetch:
      client:
        - address: generativelanguage.googleapis.com
        - address: api.github.com
      backend:
        - address: generativelanguage.googleapis.com
