<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeGraph Demo (Dev)</title>
  <link rel="stylesheet" href="styles.css">
  <script src="d3.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
  <h1>CodeGraph Demo (Dev)</h1>
      <p>GitHub Repository Knowledge Graph Analyzer</p>
    </div>

    <div class="controls">
      <div class="form-group">
        <label for="repoUrl">GitHub Repository URL</label>
        <input
          type="url"
          id="repoUrl"
          placeholder="https://github.com/user/repo"
          value="https://github.com/facebook/react"
        >
      </div>

      <div class="form-group">
        <label for="branch">Branch (default: main)</label>
        <input
          type="text"
          id="branch"
          placeholder="main"
          value="main"
        >
      </div>

      <button id="analyzeBtn">Analyze Repository</button>
      <button id="clearBtn">Clear Graph</button>
      <button id="loadBtn">Load Saved Graph</button>
    </div>

    <div id="messageArea"></div>

    <div class="stats">
      <div class="stat-item">
        <span>Files:</span>
        <span class="stat-value" id="fileCount">0</span>
      </div>
      <div class="stat-item">
        <span>Nodes:</span>
        <span class="stat-value" id="nodeCount">0</span>
      </div>
      <div class="stat-item">
        <span>Edges:</span>
        <span class="stat-value" id="edgeCount">0</span>
      </div>
    </div>

    <div class="graph-container">
      <div id="cy"></div>
      
      <!-- Legend -->
      <div class="graph-legend">
        <div class="legend-title">Node Types</div>
        <label class="legend-item">
          <input type="checkbox" class="legend-checkbox" data-node-type="file" checked>
          <span class="legend-dot file"></span>
          <span>File</span>
        </label>
        <label class="legend-item">
          <input type="checkbox" class="legend-checkbox" data-node-type="class" checked>
          <span class="legend-dot class"></span>
          <span>Class</span>
        </label>
        <label class="legend-item">
          <input type="checkbox" class="legend-checkbox" data-node-type="function" checked>
          <span class="legend-dot function"></span>
          <span>Function</span>
        </label>
        <label class="legend-item">
          <input type="checkbox" class="legend-checkbox" data-node-type="variable" checked>
          <span class="legend-dot variable"></span>
          <span>Variable</span>
        </label>
        <label class="legend-item">
          <input type="checkbox" class="legend-checkbox" data-node-type="import" checked>
          <span class="legend-dot import"></span>
          <span>Import</span>
        </label>
      </div>

      <!-- Controls -->
      <div class="graph-controls">
        <div style="margin-bottom: 4px;">Scroll to zoom</div>
        <div>Drag to pan</div>
      </div>

      <div class="node-details" id="nodeDetails"></div>
    </div>

    <div class="file-list" id="fileList"></div>
  </div>

  <script type="module" src="app-v2.js"></script>
</body>
</html>
